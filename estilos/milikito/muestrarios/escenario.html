*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;background:#102424;font-family:"Nunito",sans-serif;color:#F2F3F8;position:relative}
.patron{position:absolute;width:640px;height:520px;background-image:linear-gradient(45deg,#142928 25%,transparent 25%,transparent 75%,#142928 75%),linear-gradient(45deg,#142928 25%,transparent 25%,transparent 75%,#142928 75%);background-size:56px 56px;background-position:0 0,28px 28px;opacity:.9}
.patron.si{left:-80px;bottom:-60px;-webkit-mask:radial-gradient(circle at 0% 100%,#000 0,transparent 70%)}
.patron.sd{right:-80px;top:-60px;-webkit-mask:radial-gradient(circle at 100% 0%,#000 0,transparent 70%)}
.caja{position:absolute;border-radius:20px;overflow:hidden;box-shadow:0 18px 48px rgba(0,0,0,.45)}
.show{background:radial-gradient(ellipse at 50% 50%,transparent 30%,rgba(4,14,144,.85) 100%),repeating-conic-gradient(from 3deg at 50% 50%,#2940DD 0deg 7deg,#080CDC 7deg 14deg)}
.navy{background:#041839}
.menta{background:linear-gradient(180deg,#A6ECE6 0%,#9CE5DF 55%,#7FDCD6 100%)}
.destello{position:absolute;width:var(--t,60px);height:var(--t,60px);background:radial-gradient(circle,#FFF6C4 0 12%,#F5C121 13% 30%,transparent 31%);clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%);filter:drop-shadow(0 0 12px rgba(255,214,74,.9))}
.punto{position:absolute;width:6px;height:6px;border-radius:50%;background:#FFD84A;box-shadow:0 0 8px #FFD84A}
.juego{position:relative;font-family:"Fredoka";font-weight:700;letter-spacing:-.01em;line-height:1;white-space:nowrap}
.juego span{position:absolute;left:0;top:0}
.juego .blanco{position:relative;color:#fff;-webkit-text-stroke:calc(var(--c,26px)) #fff;text-shadow:0 12px 0 rgba(0,0,0,.35)}
.juego .tinta{color:#06103E;-webkit-text-stroke:calc(var(--c,26px) * .5) #06103E}
.juego .oro{background:linear-gradient(180deg,#FFE14A 0%,#F5C121 45%,#EE6D06 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.juego .brillo{background:linear-gradient(180deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 32%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sombra{text-shadow:0 5px 0 #06103E,0 0 18px rgba(6,16,62,.5)}
.subrayado{height:10px;border-radius:999px;background:linear-gradient(90deg,#F5C121,#FFE14A,#F5C121);box-shadow:0 4px 0 #06103E}
.etq{font-family:"Barlow Condensed";font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.metodo{position:absolute;top:118px;left:0;right:0;display:flex;justify-content:center;gap:14px}
.ficha{width:86px;height:86px;border-radius:18px;display:grid;place-items:center;font-family:"Fredoka";font-weight:700;font-size:54px}
.vista{background:#3A3410;color:#C9A83A;border:3px solid #6B5A18}
.actual{background:linear-gradient(180deg,#FFE14A,#F5C121 50%,#EE6D06);color:#1A1206;box-shadow:0 0 28px rgba(245,193,33,.7),0 6px 0 #06103E;transform:scale(1.12)}
.pend{border:3px dashed #2B4A4A;color:#4E6E6C}
.sub{position:absolute;left:50%;top:900px;transform:translateX(-50%);background:rgba(8,20,20,.92);border-radius:18px;padding:16px 34px;font-weight:800;font-size:44px;white-space:nowrap}
.sub b{color:#F5C121}
.rotulo{position:absolute;left:24px;bottom:24px;display:flex;gap:10px}
.rotulo .i{width:88px;height:88px;border-radius:12px;background:#132A2E;display:grid;place-items:center}
.rotulo .t{background:#132A2E;border-radius:12px;padding:12px 26px;font-family:"Inter";display:flex;flex-direction:column;justify-content:center}
.rotulo .n{font-weight:400;font-size:30px;color:#fff}.rotulo .c{font-weight:700;font-style:italic;font-size:24px;color:#2FA6B0}
