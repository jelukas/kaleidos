<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: stretch;
          justify-content: center;
          gap: 3.4vmin;
          background: var(--vox-ink);
          padding: 8vmin 6vmin;
        }
        .ikicker {
          align-self: flex-start;
          background: var(--vox-yellow);
          color: var(--vox-ink);
          font: 800 2.7vmin/1 var(--vox-font);
          letter-spacing: 0.3vmin;
          text-transform: uppercase;
          padding: 1.1vmin 1.7vmin;
        }
        .irow {
          display: flex;
          align-items: center;
          gap: 2.6vmin;
        }
        .iname {
          font: 900 4.6vmin/1 var(--vox-font);
          text-transform: uppercase;
          color: var(--vox-white);
          min-width: 4.6em;
        }
        .itrack {
          flex: 1;
          height: 7vmin;
          background: #1a1a21;
          position: relative;
        }
        .ifill {
          position: absolute;
          inset: 0;
          transform-origin: left center;
          background: #3a3a46;
        }
        .irow.top .ifill {
          background: var(--vox-yellow);
        }
        .ival {
          font: 900 6vmin/1 var(--vox-font);
          color: var(--vox-white);
          font-variant-numeric: tabular-nums;
          min-width: 2.4em;
          text-align: right;
        }
        .irow.top .ival {
          color: var(--vox-yellow);
        }
        .ifoot {
          font: 700 2.5vmin/1.3 var(--vox-font);
          color: #8a8a92;
          text-transform: uppercase;
          letter-spacing: 0.18vmin;
        }
      </style>

      <div id="root" data-composition-id="indice">
        <div class="ikicker" id="i-kicker">Índice de inteligencia v4.1</div>

        <div class="irow top" id="i-row-1">
          <div class="iname">Sol</div>
          <div class="itrack"><div class="ifill" id="i-fill-1"></div></div>
          <div class="ival" id="i-val-1">0</div>
        </div>
        <div class="irow" id="i-row-2">
          <div class="iname">Terra</div>
          <div class="itrack"><div class="ifill" id="i-fill-2"></div></div>
          <div class="ival" id="i-val-2">0</div>
        </div>
        <div class="irow" id="i-row-3">
          <div class="iname">Luna</div>
          <div class="itrack"><div class="ifill" id="i-fill-3"></div></div>
          <div class="ival" id="i-val-3">0</div>
        </div>

        <div class="ifoot" id="i-foot">Artificial Analysis · 9 de julio de 2026</div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Escala relativa al máximo del índice (59), no al ancho de la caja: si
        // las barras llenaran el 100%, la diferencia real se exageraría.
        const datos = [
          [1, 59],
          [2, 55],
          [3, 51],
        ];

        tl.fromTo("#i-kicker", { opacity: 0, x: "-2vmin" }, { opacity: 1, x: 0, duration: 0.26, ease: "power3.out" }, 0);

        datos.forEach(([n, v], i) => {
          const at = 0.16 + i * 0.26;
          const el = document.getElementById(`i-val-${n}`);
          const proxy = { v: 0 };
          tl.fromTo(`#i-row-${n}`, { opacity: 0, x: "-2vmin" }, { opacity: 1, x: 0, duration: 0.26, ease: "power3.out" }, at)
            .fromTo(`#i-fill-${n}`, { scaleX: 0 }, { scaleX: v / 59, duration: 0.85, ease: "power3.out" }, at)
            .fromTo(
              proxy,
              { v: 0 },
              { v, duration: 0.85, ease: "power3.out", onUpdate: () => (el.textContent = String(Math.round(proxy.v))) },
              at,
            );
        });

        tl.fromTo("#i-foot", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 1.3);

        window.__timelines["indice"] = tl;
      </script>
    </template>
  </body>
</html>
