<script>

const ID = "s12";
const DUR = 11;
const CUES = {"words":[{"t":"Tú","s":0.47,"e":0.58},{"t":"mantienes","s":0.58,"e":1.37},{"t":"el","s":1.37,"e":1.55},{"t":"control:","s":1.55,"e":2.33},{"t":"eliges","s":2.33,"e":2.72},{"t":"las","s":2.72,"e":2.91},{"t":"carpetas,","s":2.91,"e":3.64},{"t":"ves","s":3.64,"e":3.95},{"t":"cada","s":3.95,"e":4.35},{"t":"paso","s":4.35,"e":4.84},{"t":"y","s":4.84,"e":4.84},{"t":"te","s":4.84,"e":4.97},{"t":"pide","s":4.97,"e":5.24},{"t":"permiso","s":5.24,"e":5.76},{"t":"antes","s":5.76,"e":6.15},{"t":"de","s":6.15,"e":6.32},{"t":"actuar.","s":6.32,"e":6.68},{"t":"Algunas","s":7.28,"e":7.35},{"t":"funciones","s":7.35,"e":7.85},{"t":"cambian","s":7.85,"e":8.36},{"t":"según","s":8.36,"e":8.87},{"t":"tu","s":8.87,"e":9.12},{"t":"plan","s":9.12,"e":9.16},{"t":"y","s":9.16,"e":9.23},{"t":"tu","s":9.23,"e":9.37},{"t":"país.","s":9.37,"e":9.96}],"voiceStart":0.4};      // { words:[{t,s,e}], voiceStart } — tiempos relativos a la escena (s). Vacío si el plano no lleva voz
const BEATS = [0.173,0.718,1.264,1.809,2.355,2.9,3.445,3.991,4.536,5.082,5.627,6.173,6.718,7.264,7.809,8.355,8.9,9.445,9.991,10.536];    // pulsos de la música (110 BPM) relativos a la escena (s), solo los que caen dentro
const tl = gsap.timeline({ paused: true });
const E = "expo.out", SPR = "back.out(1.7)", SOFTSPR = "back.out(1.2)", IO = "power3.inOut";
const Q = (s) => "#" + ID + " " + s;
const $q = (s) => document.querySelector(Q(s));
const $$q = (s) => [...document.querySelectorAll(Q(s))];
const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9ñ]/g, "");
/* tiempo de inicio de una palabra de la locución: cue("texto") | cue("el", 1) (n-ésima coincidencia por prefijo) | cue(7) por índice */
function cue(w, nth = 0) {
  if (typeof w === "number") return CUES.words[w].s;
  const hits = CUES.words.filter((x) => norm(x.t).startsWith(norm(w)));
  if (!hits[nth]) throw new Error("cue no encontrado: " + w + " #" + nth);
  return Math.max(0, hits[nth].s - 0.05);
}
/* siguiente pulso de la música a partir de t (para clavar golpes al ritmo) */
function beat(t) { const b = BEATS.find((x) => x >= t - 0.02); return b === undefined ? t : b; }

/* ---- entradas de texto y elementos ---- */
function rise(sel, at, d = 1.0) { return tl.fromTo(Q(sel), { yPercent: 110 }, { yPercent: 0, duration: d, ease: E }, at); }   // titular dentro de .mask>.r
function up(sel, at, o = {}) { return tl.fromTo(Q(sel), { opacity: 0, y: o.y ?? 28 }, { opacity: o.to ?? 1, y: 0, duration: o.d ?? 0.8, ease: o.ease ?? E }, at); }
function pop(sel, at, d = 0.6) { return tl.fromTo(Q(sel), { opacity: 0, scale: 0.55 }, { opacity: 1, scale: 1, duration: d, ease: SPR }, at); }
function fade(sel, at, d = 0.4, to = 1) { return tl.fromTo(Q(sel), { opacity: 0 }, { opacity: to, duration: d, ease: "power2.out" }, at); }
/* golpe: escala grande + desenfoque que aterriza con sacudida */
function slam(sel, at) {
  tl.fromTo(Q(sel), { opacity: 0, scale: 1.7, filter: "blur(26px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.42, ease: "power4.out" }, at);

}
/* texto que se escribe carácter a carácter en el elemento sel; devuelve la duración */
function typeText(sel, text, at, cps = 30) {
  const el = $q(sel), o = { n: 0 };
  el.textContent = "";
  tl.to(o, { n: text.length, duration: text.length / cps, ease: "none", onUpdate: () => { el.textContent = text.slice(0, Math.round(o.n)); } }, at);
  return text.length / cps;
}
/* contador numérico 0→valor en sel */
function count(sel, to, at, d = 1.2, fmt = (v) => String(Math.round(v))) {
  const el = $q(sel), o = { v: 0 };

}
/* ---- el orbe del agente ---- */
function orbSet(x, y, at = 0) { tl.set(Q(".orb"), { x, y }, at); }
function orbTo(x, y, at, d = 0.7, ease = IO) { return tl.to(Q(".orb"), { x, y, duration: d, ease }, at); }
function orbSquash(at) {   // estira y encoge con humor (al terminar una tarea)
  tl.to(Q(".orb"), { scaleX: 1.35, scaleY: 0.72, duration: 0.11, ease: "power2.out" }, at);
  tl.to(Q(".orb"), { scaleX: 0.85, scaleY: 1.2, duration: 0.14, ease: "power2.inOut" }, at + 0.11);
  tl.to(Q(".orb"), { scaleX: 1, scaleY: 1, duration: 0.35, ease: "elastic.out(1,0.5)" }, at + 0.25);
}
function orbPulse(at, d = 0.5) { tl.fromTo(Q(".orb"), { scale: 1 }, { scale: 1.3, duration: d / 2, yoyo: true, repeat: 1, ease: "sine.inOut" }, at); }
/* clic: anillo que se expande en (x,y). Requiere <div class="ripple"> en el HTML (uno por clic: .ripple.r1, .r2…) */
function clickAt(sel, x, y, at) {
  tl.set(Q(sel), { x, y, opacity: 0 }, 0);
  tl.fromTo(Q(sel), { opacity: 0.9, scale: 0.2 }, { opacity: 0, scale: 2.2, duration: 0.6, ease: "power2.out" }, at);
  tl.fromTo(Q(".orb"), { scale: 1 }, { scale: 0.8, duration: 0.07, yoyo: true, repeat: 1, ease: "power1.inOut" }, at - 0.02);
}
/* ---- entrada / salida de escena sobre .stage ---- */
function sceneIn(kind = "fade") {
  if (kind === "cut") return;
  if (kind === "whip") tl.fromTo(Q(".stage"), { x: 260, opacity: 0, filter: "blur(22px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0);
  else if (kind === "zoom") tl.fromTo(Q(".stage"), { scale: 1.12, opacity: 0, filter: "blur(16px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0);
  else tl.fromTo(Q(".stage"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0);
}
function sceneOut(kind = "fade") {
  const t = DUR - 0.42;
  if (kind === "cut") return;
  if (kind === "whip") tl.to(Q(".stage"), { x: -260, opacity: 0, filter: "blur(22px)", duration: 0.42, ease: "power3.in" }, t);
  else if (kind === "zoom") tl.to(Q(".stage"), { scale: 1.12, opacity: 0, filter: "blur(16px)", duration: 0.42, ease: "power3.in" }, t);
  else tl.to(Q(".stage"), { opacity: 0, duration: 0.4, ease: "power2.inOut" }, t);
}

const GH = [".og1", ".og2", ".og3"];
const GS = [0.86, 0.72, 0.58], GO = [0.42, 0.26, 0.14];
function go(x, y, at, d = 0.6, ease = IO) {
  tl.to(Q(".orb"), { x, y, duration: d, ease }, at);
  GH.forEach((g, i) => tl.to(Q(g), { x, y, duration: d, ease }, at + 0.055 * (i + 1)));
}
function trailInit(x, y) { orbSet(x, y, 0); GH.forEach((g, i) => tl.set(Q(g), { x, y, scale: GS[i], opacity: GO[i] }, 0)); }
function rip(sel, x, y, at, big = 2.2) {
  tl.set(Q(sel), { x, y, scale: 0.2, opacity: 0 }, Math.max(0, at - 0.02));
  tl.to(Q(sel), { opacity: 0.9, duration: 0.01 }, at);
  tl.to(Q(sel), { scale: big, duration: 0.6, ease: "power2.out" }, at);
  tl.to(Q(sel), { opacity: 0, duration: 0.5, ease: "power2.in" }, at + 0.08);
}
const ptsEl = $q(".pts");
function burst(x, y, at, n = 8, rad = 100, rot = 0) {
  for (let i = 0; i < n; i++) {
    const el = document.createElement("div"); el.className = "pt";
    el.style.background = ["#7D29E0", "#FF01A2", "#9B61F6", "#5E3DE6"][i % 4];
    const sz = 8 + (i % 3) * 5; el.style.width = el.style.height = sz + "px"; el.style.margin = `${-sz / 2}px 0 0 ${-sz / 2}px`;
    ptsEl.appendChild(el);
    const ang = rot + i * (Math.PI * 2 / n), r = rad * (0.7 + 0.5 * ((i * 7) % 5) / 4);
    tl.fromTo(el, { x, y, opacity: 0, scale: 0.3 }, { x, y, opacity: 1, scale: 1, duration: 0.06, ease: "none" }, at);
    tl.to(el, { x: x + Math.cos(ang) * r, y: y + Math.sin(ang) * r, opacity: 0, scale: 0.2, duration: 0.65, ease: "power3.out" }, at + 0.06);
  }
}
/* archivos pequeños del diálogo */
const FG = [
  '<path d="M8 40 H36 M8 52 H36 M8 64 H26" stroke="#7D29E0" stroke-width="4.5" stroke-linecap="round"/>',
  '<rect x="10" y="36" width="44" height="32" rx="5" fill="none" stroke="#5E3DE6" stroke-width="4"/><path d="M10 47 H54 M10 58 H54 M32 36 V68" stroke="#5E3DE6" stroke-width="4"/>',
  '<circle cx="26" cy="46" r="6" fill="#FF01A2"/><path d="M12 76 L30 56 L42 68 L50 60 L66 76 Z" fill="#FF01A2" opacity=".85"/>'
];
const FC = ["#7D29E0", "#5E3DE6", "#FF01A2"];
$$q(".fl").forEach((el, i) => {

});

/* cámara: deriva lenta + empuje hacia el diálogo + vuelta */

tl.to(Q(".world"), { scale: 1.07, x: 70, duration: 0.7, ease: "power3.inOut" }, 4.85);
tl.to(Q(".world"), { scale: 1.0, x: 0, duration: 0.9, ease: "power3.inOut" }, 6.75);
tl.to(Q(".world"), { scale: 1.04, duration: 3.3, ease: "none" }, 7.65);

/* fase A: el grupo «carpeta + valla» empieza centrado y grande; luego cede sitio al panel */

tl.set(Q(".pa1"), { rotation: -6 }, 0); tl.set(Q(".pa2"), { rotation: 3 }, 0);
tl.fromTo(Q(".fold"), { opacity: 0, scale: 0.7, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.8, ease: "back.out(1.5)" }, 0);

/* el orbe intenta salir y rebota (humor) */
trailInit(500, 560);
go(560, 520, 0.2, 0.5, "power2.out");
orbPulse(0.85, 0.4);
function bounce(ix, iy, bx, by, wx, wy, at, vert, rs) {

/* interruptor 1: «eliges las carpetas» */
tl.fromTo(Q(".ctl"), { opacity: 0, x: 130 }, { opacity: 1, x: 0, duration: 0.9, ease: E }, 2.3);
tl.fromTo(Q(".row"), { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.7, ease: E, stagger: 0.12 }, 2.5);
function toggle(n, at) {

/* «ves cada paso»: el orbe recorre 3 pasos visibles dentro de la valla */

go(425, 610, V - 0.05, 0.4, "power3.inOut");
pop(".m1", V + 0.2, 0.4);

const D = cue("pide");

tl.fromTo(Q(".dlg .qb"), { scale: 0 }, { scale: 1, duration: 0.5, ease: "back.out(2.6)" }, D + 0.3);
tl.fromTo(Q(".dlg .fi i"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: E, stagger: 0.08 }, D + 0.4);
tl.fromTo(Q(".btn"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: E, stagger: 0.1 }, D + 0.5);
toggle(3, cue("permiso") + 0.1);
go(560, 700, D + 0.05, 0.5, "power3.out");
/* espera: pequeña respiración */
tl.to(Q(".orb"), { y: 690, duration: 0.45, yoyo: true, repeat: 1, ease: "sine.inOut" }, D + 0.75);
const CK = cue("actuar") + 0.1;
go(826, 600, CK - 0.5, 0.45, "power3.inOut");
rip(".r2", 826, 600, CK);
tl.fromTo(Q(".orb"), { scale: 1 }, { scale: 0.8, duration: 0.07, yoyo: true, repeat: 1, ease: "power1.inOut" }, CK - 0.02);
tl.to(Q(".btn.ok"), { scale: 0.93, backgroundColor: "#5E21B0", duration: 0.07, yoyo: true, repeat: 1, ease: "power1.inOut" }, CK - 0.02);
burst(726, 568, CK + 0.02, 10, 120);
tl.to(Q(".dlg"), { opacity: 0, scale: 0.9, y: -16, duration: 0.3, ease: "power2.in" }, CK + 0.28);

/* el orbe sigue: edita 3 archivos y los marca */

$$q(".fl").forEach((el, i) => {
  const t = CK + 0.4 + i * 0.28;
  tl.fromTo(el, { opacity: 0, x: 560, y: 470, scale: 0.3 }, { opacity: 1, x: FP[i][0], y: FP[i][1], scale: 1, duration: 0.5, ease: "back.out(1.8)" }, t);

});
orbSquash(CK + 1.35);
go(560, 560, CK + 1.45, 0.5, "power2.inOut");

/* detalle sobrio: «según tu plan y tu país» */
const N0 = cue("funciones");
tl.fromTo(Q(".lk"), { strokeDashoffset: 1, opacity: 0 }, { strokeDashoffset: 0, opacity: 0.9, duration: 0.35, ease: "power2.out" }, N0 - 0.05);
