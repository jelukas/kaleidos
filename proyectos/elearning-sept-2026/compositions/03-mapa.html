  tl.fromTo(Q(sel), { x: 0 }, { x: 14, duration: 0.045, repeat: 7, yoyo: true, ease: "none" }, at + 0.38);
  tl.set(Q(sel), { x: 0 }, at + 0.74);
}
/* texto que se escribe carácter a carácter en el elemento sel; devuelve la duración */
function typeText(sel, text, at, cps = 30) {
  const el = $q(sel), o = { n: 0 };
  el.textContent = "";
  tl.to(o, { n: text.length, duration: text.length / cps, ease: "none", onUpdate: () => { el.textContent = text.slice(0, Math.round(o.n)); } }, at);
  return text.length / cps;
}
/* contador numérico 0→valor en sel */
function count(sel, to, at, d = 1.2, fmt = (v) => String(Math.round(v))) {
  const el = $q(sel), o = { v: 0 };
  tl.to(o, { v: to, duration: d, ease: "power3.out", onUpdate: () => { el.textContent = fmt(o.v); } }, at);
}
/* ---- el orbe del agente ---- */
function orbSet(x, y, at = 0) { tl.set(Q(".orb"), { x, y }, at); }
function orbTo(x, y, at, d = 0.7, ease = IO) { return tl.to(Q(".orb"), { x, y, duration: d, ease }, at); }
function orbSquash(at) {   // estira y encoge con humor (al terminar una tarea)
  tl.to(Q(".orb"), { scaleX: 1.35, scaleY: 0.72, duration: 0.11, ease: "power2.out" }, at);
  tl.to(Q(".orb"), { scaleX: 0.85, scaleY: 1.2, duration: 0.14, ease: "power2.inOut" }, at + 0.11);
  tl.to(Q(".orb"), { scaleX: 1, scaleY: 1, duration: 0.35, ease: "elastic.out(1,0.5)" }, at + 0.25);
}
function orbPulse(at, d = 0.5) { tl.fromTo(Q(".orb"), { scale: 1 }, { scale: 1.3, duration: d / 2, yoyo: true, repeat: 1, ease: "sine.inOut" }, at); }
/* clic: anillo que se expande en (x,y). Requiere <div class="ripple"> en el HTML (uno por clic: .ripple.r1, .r2…) */
function clickAt(sel, x, y, at) {
  tl.set(Q(sel), { x, y, opacity: 0 }, 0);
  tl.fromTo(Q(sel), { opacity: 0.9, scale: 0.2 }, { opacity: 0, scale: 2.2, duration: 0.6, ease: "power2.out" }, at);
  tl.fromTo(Q(".orb"), { scale: 1 }, { scale: 0.8, duration: 0.07, yoyo: true, repeat: 1, ease: "power1.inOut" }, at - 0.02);
}
/* ---- entrada / salida de escena sobre .stage ---- */
function sceneIn(kind = "fade") {
  if (kind === "cut") return;
  if (kind === "whip") tl.fromTo(Q(".stage"), { x: 260, opacity: 0, filter: "blur(22px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0);
  else if (kind === "zoom") tl.fromTo(Q(".stage"), { scale: 1.12, opacity: 0, filter: "blur(16px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0);
  else tl.fromTo(Q(".stage"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0);
}
function sceneOut(kind = "fade") {
  const t = DUR - 0.42;
  if (kind === "cut") return;
  if (kind === "whip") tl.to(Q(".stage"), { x: -260, opacity: 0, filter: "blur(22px)", duration: 0.42, ease: "power3.in" }, t);
  else if (kind === "zoom") tl.to(Q(".stage"), { scale: 1.12, opacity: 0, filter: "blur(16px)", duration: 0.42, ease: "power3.in" }, t);
  else tl.to(Q(".stage"), { opacity: 0, duration: 0.4, ease: "power2.inOut" }, t);
}

/* ---------- NOTICIAS (kit v3) ---------- */
const MES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
/* índice de día desde el 1-sep-2026 (0) hasta el 2-oct-2026 (31) */
function dayIndex(iso) { const [y, m, d] = iso.split("-").map(Number); return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(2026, 8, 1)) / 86400000); }
function dayLabel(i) { const t = new Date(Date.UTC(2026, 8, 1) + Math.round(i) * 86400000); return t.getUTCDate() + " " + MES[t.getUTCMonth()]; }
/* tira de calendario dentro de <div class="strip [dk]"></div> (vacío en el HTML).
   dateStrip([PREV, ...DATES], at, d, gap): el marcador viaja por las fechas en orden (AAAA-MM-DD), `d` s por tramo y `gap` s entre tramos.
   La semana del 28 sep al 2 oct queda resaltada. */
function dateStrip(path, at = 0.2, d = 0.9, gap = 1.0) {
  const host = $q(".strip"), W = 1720, N = 31, X = (i) => (i / N) * W;
  let h = '<div class="rail"></div><div class="fill"></div>';
  for (let i = 0; i <= N; i++) h += '<div class="tk' + (i === 0 || i === 30 || i === 31 || i % 7 === 0 ? " m" : "") + '" style="left:' + X(i) + 'px"></div>';
  h += '<div class="wk" style="left:' + (X(27) - 8) + 'px;width:' + (X(31) - X(27) + 16) + 'px"></div>';
  h += '<div class="lb" style="left:' + X(0) + 'px">1 sep</div><div class="lb" style="left:' + X(15) + 'px">sep 2026</div><div class="lb wkl" style="left:' + X(29) + 'px">Esta semana</div>';
  h += '<div class="mk"></div><div class="dt"></div>';
  host.innerHTML = h;
  const mk = host.querySelector(".mk"), dt = host.querySelector(".dt"), fl = host.querySelector(".fill");
  const idx = path.map(dayIndex), o = { v: idx[0] };
  const draw = () => { const x = X(o.v); mk.style.left = x + "px"; dt.style.left = Math.min(Math.max(x, 60), W - 60) + "px"; dt.textContent = dayLabel(o.v); fl.style.width = x + "px"; };
  draw();
  for (let k = 1; k < idx.length; k++) tl.to(o, { v: idx[k], duration: d, ease: "power3.inOut", onUpdate: draw }, at + (k - 1) * (d + gap));
  tl.fromTo(host, { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.5, ease: E }, 0);
}
/* ventana de captura: <div class="shotwin" style="left:..;top:..;width:..;height:.."><div class="sbar"><i></i><i></i><i></i><div class="url">dominio.com</div></div><div class="view"><img src="assets/captures/x.png"></div></div>
   shotView(sel, natW, natH, fx, fy, s): coloca la imagen (ancho natW px) con el punto (fx,fy) de la imagen en el centro de la vista a escala s */
function shotPos(sel, natW, natH, fx, fy, s) {
  const win = $q(sel + " .view"), W = win.clientWidth || parseFloat(getComputedStyle(win).width), H = win.clientHeight || parseFloat(getComputedStyle(win).height);
  return { x: W / 2 - fx * s, y: H / 2 - fy * s, scale: s };
}
function shotSet(sel, natW, natH, fx, fy, s) { const p = shotPos(sel, natW, natH, fx, fy, s); tl.set(Q(sel + " .view img"), { width: natW, ...p }, 0); }
function shotCam(sel, natW, natH, fx, fy, s, at, d = 1.2, ease = "power3.inOut") { const p = shotPos(sel, natW, natH, fx, fy, s); return tl.to(Q(sel + " .view img"), { ...p, duration: d, ease }, at); }
/* caja de resaltado en coordenadas de la vista de la ventana (sel = ventana): hl(".w1", x, y, w, h, at) */
function hl(box, x, y, w, h, at, d = 0.5) {
  tl.set(Q(box), { left: x, top: y, width: w, height: h }, 0);
  tl.fromTo(Q(box), { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: d, ease: SPR }, at);
}

/* entrada: el iris violeta del logo se cierra y descubre el mapa */
tl.fromTo(Q(".irisout"), { clipPath: "circle(150% at 533px 538px)" }, { clipPath: "circle(0% at 533px 538px)", duration: 0.7, ease: "power3.out" }, 0);
tl.set(Q(".irisout"), { opacity: 0 }, 0.72);

const QQ = (list) => list.split(",").map((x) => Q(x.trim())).join(",");
/* ---------- datos: 19 noticias (fechas y bloque de las escenas s04–s17) ---------- */
const LANES = [
  { n: "IA", c: "#7D29E0", days: ["2026-09-09", "2026-09-21", "2026-09-25", "2026-09-25", "2026-09-29", "2026-09-29", "2026-09-29", "2026-10-02"] },
  { n: "Plataformas y contenidos", c: "#E6008E", days: ["2026-09-09", "2026-09-10", "2026-09-10", "2026-09-28"] },
  { n: "Mercado", c: "#9B61F6", days: ["2026-09-18", "2026-09-29"] },
  { n: "España y Europa", c: "#5E3DE6", days: ["2026-09-14", "2026-09-15", "2026-09-22", "2026-09-29", "2026-09-30"] }
];
const X = (d) => 580 + d * (1180 / 31);
const LY = (i) => 560 + i * 116 + 48;            // centro vertical de cada carril
const AY = 478;                                    // línea base de la fila de fechas

/* eje: marcas y etiquetas */
let axh = "";
for (let d = 0; d <= 31; d++) axh += '<div class="tk' + (d % 7 === 0 || d === 31 ? " m" : "") + '" style="left:' + X(d) + 'px"></div>';
[[0, "1 sep"], [7, "8"], [14, "15"], [21, "22"], [28, "29"], [31, "2 oct"]].forEach(([d, t]) => { axh += '<div class="tl" style="left:' + X(d) + 'px">' + t + "</div>"; });
$q(".axis").innerHTML = axh;

/* carriles */
let lh = "";
LANES.forEach((L, i) => {
  const y = 560 + i * 116;
  lh += '<div class="trk l' + i + '" style="top:' + y + 'px;background:' + L.c + '22"></div>';
  lh += '<div class="chipl l' + i + ' c' + i + '" style="top:' + (LY(i) - 32) + 'px;background:' + L.c + '">' + L.n + "</div>";
  lh += '<div class="cnt l' + i + ' b' + i + '" style="top:' + (LY(i) - 34) + 'px;background:' + L.c + '">' + L.days.length + "</div>";
});
lh += '<div class="fillbar" style="top:560px"></div>';
$q(".lanes").innerHTML = lh;

/* puntos: orden por día; apilados por fecha en la fila de fechas y en cada carril */
const dots = [];
LANES.forEach((L, li) => {
  const byDay = {};
  L.days.forEach((iso) => { const d = dayIndex(iso); (byDay[d] = byDay[d] || []).push(d); });
  Object.keys(byDay).forEach((k) => { byDay[k].forEach((d, j, arr) => dots.push({ d, li, j, nj: arr.length })); });
});
dots.sort((a, b) => a.d - b.d || a.li - b.li);
const axCount = {};
dots.forEach((o) => { axCount[o.d] = (axCount[o.d] || 0); o.k = axCount[o.d]++; });
const dotsEl = $q(".dots"), ringsEl = $q(".rings");
dots.forEach((o, i) => {
  const el = document.createElement("div"); el.className = "dot d" + o.li; dotsEl.appendChild(el); o.el = el;
  o.ax = X(o.d); o.ay = AY - 22 - o.k * 24;
  o.ly = LY(o.li) + (o.j - (o.nj - 1) / 2) * 30;
  o.t = 0.55 + (o.d / 31) * 1.5;
  tl.set(el, { x: o.ax, y: o.ay, opacity: 0, scale: 0.2 }, 0);
});

/* ---------- 0–2,1 s: la fecha recorre el mes y las 19 noticias se encienden ---------- */
up(".eyeb", 0.3, { y: 14, d: 0.5 });
tl.fromTo(Q(".stat.s1"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: E }, 0.25);
tl.fromTo(Q(".rail"), { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: E }, 0.2);
tl.fromTo(Q(".axis .tk"), { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.012 }, 0.3);
tl.fromTo(Q(".axis .tl"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.06 }, 0.5);
up(".axt", 0.35, { y: 10, d: 0.5 });
const SW0 = 0.55, SWD = 1.5, sw = { p: 0 }, cnum = $q(".s1 .n"), pl = $q(".play"), plb = $q(".playlb");
pl.style.left = X(0) + "px"; plb.style.left = X(0) + "px";
tl.set(Q(".play"), { opacity: 1 }, SW0 - 0.05); tl.set(Q(".playlb"), { opacity: 1 }, SW0 - 0.05);
tl.set(Q(".play"), { opacity: 0 }, SW0 + SWD + 0.3); tl.set(Q(".playlb"), { opacity: 0 }, SW0 + SWD + 0.3);
tl.to(sw, { p: 1, duration: SWD, ease: "none", onUpdate: () => {
  const d = sw.p * 31, x = X(d);
  pl.style.left = x + "px"; plb.style.left = x + "px"; plb.textContent = dayLabel(d);
  cnum.textContent = dots.filter((q) => q.d <= d + 0.0001).length;
} }, SW0);
dots.forEach((q) => { tl.fromTo(q.el, { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 0.78, duration: 0.35, ease: SPR }, q.t); });
tl.fromTo(Q(".stat.s1 .u"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: E }, cue("noticias"));
tl.fromTo(Q(".stat.s1 .n"), { scale: 1 }, { scale: 1.1, duration: 0.18, yoyo: true, repeat: 1, ease: "sine.inOut", transformOrigin: "0% 100%" }, SW0 + SWD);

/* ---------- 2,07 s «cuatro bloques»: los carriles se despliegan y los puntos caen ---------- */
const C4 = cue("cuatro"), BL = cue("bloques");
tl.fromTo(Q(".stat.s2"), { opacity: 0, scale: 0.5, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: SPR, transformOrigin: "0% 100%" }, C4);
LANES.forEach((L, i) => {
  tl.fromTo(Q(".trk.l" + i), { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.7, ease: E }, C4 + 0.05 + i * 0.13);
  tl.fromTo(Q(".chipl.c" + i), { opacity: 0 }, { opacity: 1, duration: 0.08 }, BL + i * 0.13);
  tl.fromTo(Q(".chipl.c" + i), { scale: 0.4, x: -60 }, { scale: 1, x: 0, duration: 0.55, ease: SPR, transformOrigin: "0% 50%" }, BL + i * 0.13);
  tl.fromTo(Q(".cnt.b" + i), { opacity: 0 }, { opacity: 1, duration: 0.08 }, BL + 0.35 + i * 0.13);
  tl.fromTo(Q(".cnt.b" + i), { scale: 0.3 }, { scale: 1, duration: 0.5, ease: SPR }, BL + 0.35 + i * 0.13);
});
const DROP = beat(BL);
dots.forEach((q, i) => {
  const t = DROP + i * 0.032, col = LANES[q.li].c;
  tl.to(q.el, { x: q.ax, y: q.ly, scale: 1, duration: 0.62, ease: "bounce.out" }, t);
  tl.to(q.el, { borderColor: col, duration: 0.2, ease: "none" }, t + 0.28);
});
tl.to(QQ(".rail, .axis, .axt"), { opacity: 0.35, duration: 0.5 }, DROP + 0.7);

/* ---------- 3,57 s «tres minutos»: el reloj del vídeo ---------- */
const MN = cue("tres");
tl.fromTo(Q(".stat.s3"), { opacity: 0, scale: 0.5, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: SPR, transformOrigin: "0% 100%" }, MN);
count(".s3 .n", 234, MN + 0.1, 1.5, (v) => Math.floor(v / 60) + ":" + String(Math.floor(v % 60)).padStart(2, "0"));

/* ---------- 4,4 s: ESTA SEMANA ---------- */
const WKT = 4.4;
tl.fromTo(Q(".wcol"), { opacity: 0, scaleY: 0.3 }, { opacity: 1, scaleY: 1, duration: 0.6, ease: E }, WKT);
tl.fromTo(Q(".wlab"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: E }, WKT + 0.2);
dots.filter((q) => q.d >= 27).forEach((q, i) => tl.fromTo(q.el, { scale: 1 }, { scale: 1.45, duration: 0.2, yoyo: true, repeat: 1, ease: "sine.inOut" }, WKT + 0.25 + i * 0.05));

/* ---------- 5,04 s «empezamos por donde más ruido hay»: la IA se hace notar ---------- */
const NO = cue("empezamos"), RU = cue("ruido");
tl.to(QQ(".trk.l1,.trk.l2,.trk.l3,.d1,.d2,.d3"), { opacity: 0.22, duration: 0.5, ease: "power2.out" }, NO);
tl.to(QQ(".chipl.c1,.chipl.c2,.chipl.c3,.cnt.b1,.cnt.b2,.cnt.b3"), { scale: 0.88, duration: 0.5, ease: "power2.out", transformOrigin: "0% 50%" }, NO);
tl.to(Q(".wcol"), { opacity: 0.35, duration: 0.5 }, NO);
tl.to(Q(".trk.l0"), { scaleY: 1.18, duration: 0.5, ease: SPR }, NO + 0.1);
tl.fromTo(Q(".cnt.b0"), { scale: 1 }, { scale: 1.3, duration: 0.3, yoyo: true, repeat: 3, ease: "sine.inOut" }, RU - 0.2);
dots.filter((q) => q.li === 0).forEach((q, i) => {
  const r = document.createElement("div"); r.className = "rg"; ringsEl.appendChild(r);
  tl.set(r, { x: q.ax, y: q.ly }, 0);
  [0, 0.55].forEach((add) => tl.fromTo(r, { opacity: 0.9, scale: 0.8 }, { opacity: 0, scale: 3.6, duration: 0.8, ease: "power2.out", immediateRender: false }, RU - 0.1 + add + i * 0.07));
  tl.fromTo(q.el, { scale: 1 }, { scale: 1.4, duration: 0.18, yoyo: true, repeat: 1, ease: "sine.inOut" }, RU - 0.1 + i * 0.07);
});

/* ---------- 7,3 s «la inteligencia artificial»: el carril IA se llena y explota ---------- */
const IA = cue("inteligencia");
tl.fromTo(Q(".fillbar"), { scaleX: 0, opacity: 1 }, { scaleX: 1, opacity: 1, duration: 0.55, ease: "power3.inOut" }, IA);
tl.to(Q(".trk.l0"), { opacity: 0, duration: 0.1 }, IA + 0.5);
tl.to(Q(".d0"), { backgroundColor: "#FFFFFF", borderColor: "#FFFFFF", duration: 0.3 }, IA + 0.2);
tl.fromTo(Q(".chipl.c0"), { scale: 1 }, { scale: 1.25, duration: 0.4, ease: SPR, transformOrigin: "0% 50%" }, IA);
tl.fromTo(Q(".fillbar"), { scaleY: 1 }, { scaleY: 1.18, duration: 0.4, ease: SPR }, IA);
tl.to(Q(".world"), { scale: 1.1, duration: 1.4, ease: "power2.in" }, IA + 0.2);
const FL = IA + 0.45;
tl.set(Q(".world"), { opacity: 0 }, FL + 1.17);
tl.set(Q(".flood"), { opacity: 1 }, FL);
tl.fromTo(Q(".flood"), { scale: 0.1 }, { scale: 30, duration: 1.15, ease: "power3.in" }, FL);
tl.fromTo(Q(".deepfade"), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.inOut" }, DUR - 1.0);
window.__timelines["s03"] = tl;
</script>
